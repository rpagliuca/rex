openapi: 3.0.3
info:
  title: rex
  version: 0.1.0
  description: |
    API de Tarefas e Sessões de Trabalho do rex.
    Operações sobre uma sessão exigem o token entregue na criação dela.
    Integrações (lembretes, notificações, agentes): docs/integracao.md.
paths:
  /tarefas:
    get:
      operationId: listarTarefas
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusTarefa' }
        - name: organizacao
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tarefas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tarefa' }
    post:
      operationId: criarTarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaTarefa' }
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterTarefa
      responses:
        '200':
          description: Tarefa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarTarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoTarefa' }
      responses:
        '200':
          description: Tarefa alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/lancamento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: lancarAgente
      description: |
        Põe a tarefa em andamento e sobe um agente para ela, com instrução adicional de reabertura,
        modelo e esforço opcionais. Exige o lançador de agentes configurado e a tarefa sem sessão ativa.
        Antes, mede a máquina: com menos RAM disponível que o mínimo, recusa com 409 e a medição em
        `recursos`, a menos que o pedido traga `forcar`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeLancamento' }
      responses:
        '200':
          description: Tarefa em andamento; o agente está subindo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /origens:
    get:
      operationId: listarOrigens
      responses:
        '200':
          description: Origens, por nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Origem' }
    post:
      operationId: criarOrigem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaOrigem' }
      responses:
        '201':
          description: Origem criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '400': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /origens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterOrigem
      responses:
        '200':
          description: Origem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarOrigem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoOrigem' }
      responses:
        '200':
          description: Origem alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos:
    get:
      operationId: listarRequisitos
      description: Todos os requisitos, com as ligações (origem, cadeia e tarefas) em identificadores.
      parameters:
        - name: organizacao
          in: query
          schema: { type: string }
        - name: origem
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Requisitos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Requisito' }
    post:
      operationId: criarRequisito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoRequisito' }
      responses:
        '201':
          description: Requisito criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterRequisito
      responses:
        '200':
          description: Requisito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarRequisito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoRequisito' }
      responses:
        '200':
          description: Requisito alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/derivacoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: derivarRequisito
      description: Registra que o requisito deriva de outro. Recusa ciclos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Derivacao' }
      responses:
        '200':
          description: Requisito com a derivação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/derivacoes/{pai}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: pai
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: definirPontos
      description: |
        Define os pontos de importância do requisito sob este pai. Os pontos só se comparam entre
        irmãos: a fatia é pontos / soma dos pontos dos irmãos. Sem pontos, a ligação volta a não
        triada (conta como 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pontos' }
      responses:
        '200':
          description: Requisito com os pontos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
    delete:
      operationId: desfazerDerivacao
      description: Recusa deixar o requisito sem pai (só o zero não deriva de nenhum).
      responses:
        '200':
          description: Requisito sem a derivação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/obsolescencia:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: marcarObsoleto
      description: |
        Marca o requisito como obsoleto, com o motivo: nada é apagado. Ele deixa de limitar o estado
        dos pais e de pesar entre os irmãos, sai da busca e da árvore padrão, e as tarefas abertas
        dele ficam sinalizadas para decisão. Recusa o zero.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Obsolescencia' }
      responses:
        '200':
          description: Requisito obsoleto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
    delete:
      operationId: reativarRequisito
      description: Desfaz a obsolescência (marcado por engano); o histórico fica nos eventos.
      responses:
        '200':
          description: Requisito reativado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/execucoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarExecucoes
      description: Execuções (verificações de conformidade) do requisito, da mais recente para a mais antiga.
      responses:
        '200':
          description: Execuções
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Execucao' }
        '404': { $ref: '#/components/responses/Erro' }
    post:
      operationId: registrarExecucao
      description: Registra que o requisito foi verificado e está conforme, com a evidência e o prazo de validade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaExecucao' }
      responses:
        '201':
          description: Execução registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execucao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates:
    get:
      operationId: listarTemplates
      description: Templates de tarefa, com a última instância e se estão devidos agora.
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
    post:
      operationId: criarTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoTemplate' }
      responses:
        '201':
          description: Template criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterTemplate
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoTemplate' }
      responses:
        '200':
          description: Template alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates/{id}/instancias:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: instanciarTemplate
      description: Cria uma tarefa a partir do template (a fazer), ligada aos mesmos requisitos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeInstancia' }
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /organizacoes:
    get:
      operationId: listarOrganizacoes
      description: Organizações em uso (tarefas, requisitos, templates) e o zero de cada uma.
      responses:
        '200':
          description: Organizações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organizacao' }
  /organizacoes/{nome}:
    parameters:
      - name: nome
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: definirOrganizacao
      description: Atribui o zero da organização (um requisito dela).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinicaoDeOrganizacao' }
      responses:
        '200':
          description: Organização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /componentes:
    get:
      operationId: listarComponentes
      responses:
        '200':
          description: Componentes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Componente' }
    post:
      operationId: criarComponente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoComponente' }
      responses:
        '201':
          description: Componente criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Componente' }
        '400': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /componentes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterComponente
      responses:
        '200':
          description: Componente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Componente' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarComponente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoComponente' }
      responses:
        '200':
          description: Componente alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Componente' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/componentes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularComponenteARequisito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoComponente' }
      responses:
        '200':
          description: Com o componente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/componentes/{componente}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: componente
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: desvincularComponenteDeRequisito
      responses:
        '200':
          description: Sem o componente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/componentes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularComponenteATarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoComponente' }
      responses:
        '200':
          description: Com o componente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/componentes/{componente}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: componente
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: desvincularComponenteDeTarefa
      responses:
        '200':
          description: Sem o componente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /busca/requisitos:
    get:
      operationId: buscarRequisitos
      description: |
        Busca por palavras no título (peso maior) e na descrição, sem acento e com prefixo (backup acha
        backups). Devolve só o resumo dos mais relevantes, para gastar poucos tokens.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: organizacao, in: query, schema: { type: string } }
        - { name: componente, in: query, schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, default: 10 } }
        - { name: incluir_obsoletos, in: query, description: 'Padrão: os obsoletos ficam de fora', schema: { type: boolean } }
      responses:
        '200':
          description: Requisitos encontrados, do mais ao menos relevante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResumoDeRequisito' }
  /busca/tarefas:
    get:
      operationId: consultarTarefas
      description: |
        Consulta compacta para agentes: só id, título, status, organização, sessão ativa e a espera dela,
        sem descrição nem resumo. Exige ao menos um filtro (nunca a lista inteira); da atualizada mais
        recente para a mais antiga, até o limite; `total` diz quantas casaram e `fora`, quantas ficaram de fora.
      parameters:
        - name: status
          in: query
          description: 'Um ou mais status, separados por vírgula (ex.: em_validacao,bloqueada)'
          schema: { type: string }
        - { name: organizacao, in: query, schema: { type: string } }
        - { name: componente, in: query, description: 'Componente, como C-0001', schema: { type: string } }
        - { name: requisito, in: query, description: 'Requisito que a tarefa tenta atender, como R-0001', schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Tarefas que casaram
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaDeTarefas' }
        '400': { $ref: '#/components/responses/Erro' }
  /arvore/requisitos:
    get:
      operationId: arvoreDeRequisitos
      description: |
        A cadeia em texto, um requisito por linha ("R-0001 título"), indentada pela derivação. Começa no
        zero da organização (ou no geral); com componente, só os requisitos dele e os ancestrais.
        Os obsoletos (e o que só se chega por eles) ficam de fora, salvo com incluir_obsoletos.
      parameters:
        - { name: organizacao, in: query, schema: { type: string } }
        - { name: componente, in: query, schema: { type: string } }
        - { name: incluir_obsoletos, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Árvore
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArvoreDeRequisitos' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/requisitos:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularRequisito
      description: Registra que a tarefa tenta atender o requisito.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoRequisito' }
      responses:
        '200':
          description: Tarefa com o vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/requisitos/{requisito}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: requisito
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: desvincularRequisito
      responses:
        '200':
          description: Tarefa sem o vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /lancador:
    get:
      operationId: opcoesDoLancador
      description: Modelos e esforços que o lançador de agentes aceita. 404 se não há lançador.
      responses:
        '200':
          description: Opções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpcoesDeLancamento' }
        '404': { $ref: '#/components/responses/Erro' }
  /recursos:
    get:
      operationId: recursosDaMaquina
      description: |
        RAM e CPU da máquina do lançador: disponível, sessões de trabalho abertas, Steam, Chromium do
        agente navegador, containers do docker por projeto e os maiores processos por RAM e por CPU (só
        nome e pid). Leva cerca de 2 s (amostra de CPU e docker stats). 404 se não há lançador.
      responses:
        '200':
          description: Medição
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recursos' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/sessoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarSessoesDaTarefa
      description: Histórico de sessões que trabalharam na tarefa, da mais recente para a mais antiga.
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sessao' }
        '404': { $ref: '#/components/responses/Erro' }
  /sessoes:
    get:
      operationId: listarSessoes
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusSessao' }
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sessao' }
    post:
      operationId: criarSessao
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaSessao' }
      responses:
        '201':
          description: Sessão criada; o token só é entregue aqui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoCriada' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterSessao
      responses:
        '200':
          description: Sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarSessao
      description: Atualiza os localizadores do journal e dos artefatos, e o nome curto. O agente não pode ser alterado.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoSessao' }
      responses:
        '200':
          description: Sessão alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/tarefas:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularTarefa
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vinculo' }
      responses:
        '200':
          description: Tarefa vinculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/encerramento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: encerrarSessao
      description: Encerra a sessão, libera as tarefas e grava o resumo em cada uma delas.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Encerramento' }
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/encerramento-manual:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: encerrarSessaoManualmente
      description: |
        Encerramento feito por um humano (pelo frontend), sem o token da sessão, para quando o agente
        não está mais vivo para encerrar. Grava o resumo como no encerramento normal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Encerramento' }
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/repasse:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: repassarSessao
      description: |
        Troca de agente. Encerra a sessão como substituída e cria outra, com `anterior` apontando
        para ela e as mesmas tarefas, numa única operação.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Repasse' }
      responses:
        '201':
          description: Nova sessão; o token só é entregue aqui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoCriada' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /importacao:
    post:
      operationId: importarTarefa
      description: |
        Importa uma tarefa já existente fora do rex, com as datas originais e as sessões que
        trabalharam nela, todas já encerradas. Os eventos registram o momento real da importação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportacaoTarefa' }
      responses:
        '201':
          description: Tarefa importada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
  /eventos:
    get:
      operationId: listarEventos
      parameters:
        - name: entidade
          in: query
          description: Identificador da entidade, como T-0001 ou S-0001
          schema: { type: string }
        - name: depois
          in: query
          description: 'Só eventos com id maior (cursor; ver Pendencias.ultimo_evento)'
          schema: { type: integer, format: int64 }
        - name: tipo
          in: query
          description: 'Um ou mais tipos, separados por vírgula (ex.: lembrete_disparado,sessao_aguardando)'
          schema: { type: string }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: Eventos, do mais antigo para o mais recente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
  /lembretes:
    get:
      operationId: listarLembretes
      description: |
        Lembretes por hora marcada, do mais próximo para o mais distante. Sem filtros, só os que
        ainda pedem atenção (agendado, adiado e disparado).
      parameters:
        - name: status
          in: query
          description: Um ou mais status, separados por vírgula
          schema: { type: string, example: 'agendado,adiado' }
        - name: ate
          in: query
          description: 'Só os com hora marcada até este instante (ex.: agora + 2 h, para ver o que vence)'
          schema: { type: string, format: date-time }
        - name: organizacao
          in: query
          schema: { type: string }
        - name: tarefa
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lembretes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lembrete' }
        '400': { $ref: '#/components/responses/Erro' }
    post:
      operationId: criarLembrete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoLembrete' }
      responses:
        '201':
          description: Lembrete agendado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /lembretes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterLembrete
      responses:
        '200':
          description: Lembrete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarLembrete
      description: |
        Corrige texto, hora, organização ou ligações. Mudar `quando` de um lembrete disparado o volta
        a agendado. Lembrete confirmado ou cancelado não muda (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoLembrete' }
      responses:
        '200':
          description: Lembrete alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /lembretes/{id}/confirmacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: confirmarLembrete
      description: |
        O Rafael viu o lembrete. Vale para disparado e também para agendado/adiado (confirmar antes da
        hora encerra o lembrete sem disparar). Repetir em um confirmado devolve 200 sem novo evento.
      responses:
        '200':
          description: Lembrete confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /lembretes/{id}/adiamento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: adiarLembrete
      description: Reagenda para `ate` ou para agora + `minutos` (um dos dois). O status vira adiado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Adiamento' }
      responses:
        '200':
          description: Lembrete adiado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /lembretes/{id}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: cancelarLembrete
      responses:
        '200':
          description: Lembrete cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lembrete' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/espera:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: aguardarResposta
      description: |
        O agente entregou ou ficou bloqueado e está esperando o Rafael. Fica em `aguardando` na sessão
        e nas pendências até `DELETE` (o agente retomou) ou o encerramento da sessão.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Espera' }
      responses:
        '200':
          description: Sessão aguardando
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
    delete:
      operationId: retomarSessao
      security:
        - tokenDaSessao: []
      responses:
        '200':
          description: Sessão sem espera
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/mensagens:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: enviarASessao
      description: |
        Uma sessão escreve uma mensagem no agente de outra (S-0001, ou a sessão ativa da tarefa T-0001).
        A origem é a sessão dona do token. A mensagem chega identificada por ela, "[rex · de S-0001 nome]",
        e com a instrução de responder por esta mesma rota para a origem: a resposta entra no chat da
        origem como mensagem nova, sem ela precisar ler a conversa nem a tela da outra. Com o agente
        trabalhando, entra na fila dele. Recusada (409) quando o agente está numa tela de permissão.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensagemDeVoz' }
      responses:
        '201':
          description: Entregue ao agente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensagemEntreSessoes' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /integracao/pendencias:
    get:
      operationId: listarPendencias
      description: |
        Retrato do que pede atenção do Rafael agora, para integrações que fazem polling (ver
        docs/integracao.md). É estado, não histórico: um consumidor que perdeu chamadas se recupera na
        seguinte. Lembretes: os disparados (até confirmar ou adiar) e os agendados/adiados com hora
        marcada até `horizonte`; as antecedências de apresentação são do consumidor.
      parameters:
        - name: horizonte
          in: query
          description: 'Lembretes que vencem até agora + horizonte, em minutos. Padrão: 120'
          schema: { type: integer, minimum: 0, maximum: 10080 }
      responses:
        '200':
          description: Pendências
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pendencias' }
        '400': { $ref: '#/components/responses/Erro' }
  /voz/sessoes:
    get:
      operationId: panoramaDaVoz
      description: |
        As sessões ativas, cada uma com o que o agente faz agora (lido da tela
        do tmux), se pediu resposta ao Rafael, quantas novidades ele ainda não ouviu e o último texto do
        agente (só o começo). Leve: responde "quais sessões esperam meu input?" numa chamada; o detalhe
        de uma sessão (tela, novidades inteiras) vem em /voz/sessoes/{id}. Não mexe nos ponteiros.
      responses:
        '200':
          description: Panorama
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PanoramaDeVoz' }
  /voz/sessoes/{id}:
    get:
      operationId: obterVoz
      description: |
        Uma sessão (S-0001, ou a sessão ativa da tarefa T-0001): o que o agente está fazendo agora e as
        novidades da conversa dele depois do ponteiro do que o Rafael já ouviu. Sem `ouvir`, não avança
        o ponteiro. Com `ouvir`, as novidades viram ouvidas na hora: é o caso do conector do app do
        Claude, que fala o que recebe. Com `esperar`, segura a resposta até o agente responder algo novo
        ou parar de trabalhar.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: ouvir
          in: query
          schema: { type: boolean }
        - name: esperar
          in: query
          description: 'Segundos (até 20) para esperar novidade enquanto o agente trabalha'
          schema: { type: integer, minimum: 0, maximum: 20 }
      responses:
        '200':
          description: Estado da sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voz' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /voz/sessoes/{id}/mensagens:
    post:
      operationId: enviarVoz
      description: |
        Escreve a frase do Rafael no agente da sessão, numerada como pedido N. Com o agente trabalhando,
        o Claude Code a põe na fila dele, em ordem. Recusada (409) quando o agente está numa tela de
        permissão: a frase cairia na escolha; responda antes com as teclas.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensagemDeVoz' }
      responses:
        '201':
          description: Entregue ao agente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDeVoz' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /voz/sessoes/{id}/teclas:
    post:
      operationId: teclarVoz
      description: |
        Aperta uma tecla no agente da sessão: um número ou Enter só numa tela de permissão (a escolha
        que o Rafael falou); Escape interrompe o agente a qualquer momento.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeclaDeVoz' }
      responses:
        '200':
          description: Tecla apertada; o estado logo depois
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voz' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
components:
  securitySchemes:
    tokenDaSessao:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Erro:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string }
        recursos: { $ref: '#/components/schemas/Recursos', description: 'Na recusa de lançamento por falta de memória' }
    StatusTarefa:
      type: string
      enum: [a_fazer, em_andamento, pausada, bloqueada, em_validacao, concluida]
    StatusSessao:
      type: string
      enum: [ativa, encerrada, substituida]
    TipoAgente:
      type: string
      enum: [ia, humano]
    MotivoEncerramento:
      type: string
      enum: [fim_do_trabalho, troca_de_agente]
    Tarefa:
      type: object
      required: [id, titulo, descricao, organizacao, status, resumo, criada_em, atualizada_em]
      properties:
        id: { type: string, example: T-0001 }
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        resumo:
          type: string
          description: Estado para retomar, gravado no encerramento de cada sessão
        sessao_ativa: { type: string, example: S-0001 }
        template: { type: string, example: TP-0001, description: 'Template do qual a tarefa foi instanciada' }
        componentes:
          type: array
          description: Componentes em que a tarefa mexe (só no detalhe da tarefa)
          items: { type: string }
        requisitos:
          type: array
          description: Requisitos que a tarefa tenta atender (só na leitura de uma tarefa)
          items: { type: string }
        peso:
          type: number
          description: 'Soma do peso no total dos requisitos que a tarefa tenta atender, de 0 a 1; a fila ordena por ele'
        requisitos_obsoletos:
          type: array
          description: 'Requisitos obsoletos que a tarefa, ainda não concluída, tenta atender: pede decisão (concluir, religar a outro requisito ou desvincular)'
          items: { type: string }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }
    Template:
      type: object
      description: |
        Tarefa que sempre precisa ser executada, sob demanda (sem periodicidade) ou periódica. Nada é
        instanciado automaticamente: periódico com a última instância mais antiga que a periodicidade
        (ou nunca instanciado), e sem instância aberta, está devido.
      required: [id, titulo, descricao, organizacao, requisitos, instancias, devido, criado_em, atualizado_em]
      properties:
        id: { type: string, example: TP-0001 }
        titulo: { type: string }
        descricao: { type: string, description: 'Instruções; vira a descrição de cada instância' }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, description: 'Sem ele, sob demanda' }
        requisitos:
          type: array
          description: Requisitos aos quais cada instância é ligada
          items: { type: string }
        instancias:
          type: array
          description: Tarefas instanciadas, da mais recente para a mais antiga
          items: { type: string }
        ultima_instancia_em: { type: string, format: date-time }
        instancia_aberta: { type: string, description: 'Instância ainda não concluída, se houver' }
        proxima_em: { type: string, format: date-time, description: 'Quando a próxima instância é devida (periódicos)' }
        devido: { type: boolean }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    NovoTemplate:
      type: object
      required: [titulo, organizacao]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, minimum: 1 }
        requisitos:
          type: array
          items: { type: string }
    AlteracaoTemplate:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, minimum: 0, description: '0 torna sob demanda' }
        requisitos:
          type: array
          description: Substitui a lista inteira
          items: { type: string }
    PedidoDeInstancia:
      type: object
      properties:
        contexto: { type: string, description: 'Informações desta instância; vão para o topo da descrição da tarefa' }
        titulo: { type: string, description: 'Padrão: o título do template com a data (o agente dá um título específico ao começar)' }
    Organizacao:
      type: object
      required: [nome]
      properties:
        nome: { type: string }
        zero: { type: string, example: R-0002, description: 'Requisito do qual todos os outros da organização derivam' }
    DefinicaoDeOrganizacao:
      type: object
      required: [zero]
      properties:
        zero: { type: string }
    Componente:
      type: object
      description: Qualquer coisa reaproveitável a que requisitos e tarefas se referem (repositório, módulo, lugar, funcionalidade).
      required: [id, nome, descricao, organizacoes, requisitos, tarefas, criado_em]
      properties:
        id: { type: string, example: C-0001 }
        nome: { type: string }
        descricao: { type: string }
        organizacoes:
          type: array
          description: Organizações a que o componente pertence (pelo menos uma)
          items: { type: string }
        requisitos:
          type: array
          items: { type: string }
        tarefas:
          type: array
          items: { type: string }
        criado_em: { type: string, format: date-time }
    NovoComponente:
      type: object
      required: [nome, organizacoes]
      properties:
        nome: { type: string }
        descricao: { type: string }
        organizacoes:
          type: array
          items: { type: string }
    AlteracaoComponente:
      type: object
      properties:
        nome: { type: string }
        descricao: { type: string }
        organizacoes:
          type: array
          description: Substitui a lista inteira (pelo menos uma)
          items: { type: string }
    VinculoComponente:
      type: object
      required: [componente]
      properties:
        componente: { type: string, example: C-0001 }
    ResumoDeRequisito:
      type: object
      required: [id, titulo, organizacao, estado, componentes]
      properties:
        id: { type: string }
        titulo: { type: string }
        organizacao: { type: string }
        estado: { $ref: '#/components/schemas/EstadoDoRequisito' }
        obsoleto: { type: boolean, description: 'Só presente (true) com incluir_obsoletos' }
        componentes:
          type: array
          items: { type: string }
    ResumoDeTarefa:
      type: object
      required: [id, titulo, status, organizacao]
      properties:
        id: { type: string }
        titulo: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        organizacao: { type: string }
        sessao_ativa: { type: string }
        aguardando:
          type: string
          description: O que a sessão ativa espera do Rafael, se está aguardando
    ConsultaDeTarefas:
      type: object
      required: [tarefas, total, fora]
      properties:
        tarefas:
          type: array
          items: { $ref: '#/components/schemas/ResumoDeTarefa' }
        total:
          type: integer
          description: Quantas casaram com o filtro, incluindo as que ficaram fora
        fora:
          type: integer
          description: Quantas casaram com o filtro e ficaram fora pelo limite
    ArvoreDeRequisitos:
      type: object
      required: [texto, requisitos]
      properties:
        texto: { type: string }
        requisitos: { type: integer }
    NovaTarefa:
      type: object
      required: [titulo, organizacao]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        requisitos:
          type: array
          description: Requisitos que ela tenta atender, já vinculados na criação
          items: { type: string }
        componentes:
          type: array
          description: Componentes em que ela mexe, já vinculados na criação
          items: { type: string }
    AlteracaoTarefa:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        resumo: { type: string }
    Origem:
      type: object
      required: [id, nome, tipo, descricao, criada_em]
      properties:
        id: { type: string, example: O-0001 }
        nome: { type: string, description: 'Pessoa (quem pede) ou documento (lei, norma, contrato)' }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
        criada_em: { type: string, format: date-time }
    TipoOrigem:
      type: string
      enum: [pessoa, documento]
    NovaOrigem:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
    AlteracaoOrigem:
      type: object
      properties:
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
    Requisito:
      type: object
      required: [id, titulo, descricao, organizacao, deriva_de, derivados, tarefas, componentes, atencao, estado, estado_proprio, limitado_por, tarefas_abertas, importancia, peso, criado_em, atualizado_em]
      properties:
        id: { type: string, example: R-0001 }
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        origem: { type: string, example: O-0001 }
        deriva_de:
          type: array
          description: Requisitos dos quais este deriva (acima na cadeia)
          items: { type: string }
        derivados:
          type: array
          description: Requisitos que derivam deste (abaixo na cadeia)
          items: { type: string }
        tarefas:
          type: array
          description: Tarefas que tentam atender este requisito
          items: { type: string }
        atencao:
          type: array
          description: Motivos pelos quais o requisito não está bem cuidado (vazio se está)
          items: { $ref: '#/components/schemas/Atencao' }
        estado: { $ref: '#/components/schemas/EstadoDoRequisito' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        importancia:
          type: array
          description: Os pontos e a fatia entre irmãos sob cada pai, na ordem de deriva_de
          items: { $ref: '#/components/schemas/Importancia' }
        peso:
          type: number
          description: 'Peso no total, de 0 a 1: o zero vale 1; cada requisito soma, sobre os pais, o peso do pai vezes a fatia sob ele'
        trilhas:
          type: array
          description: 'Só ao obter um requisito: cada caminho do zero até ele, em títulos ("R-0001 … › R-0003 …")'
          items: { type: string }
        componentes:
          type: array
          description: Componentes a que o requisito se refere
          items: { type: string }
        estado_proprio: { $ref: '#/components/schemas/EstadoDoRequisito' }
        limitado_por:
          type: array
          description: Requisitos logo abaixo que limitam o estado dele a um menos maduro que o próprio
          items: { type: string }
        tarefas_abertas:
          type: array
          description: Tarefas ligadas a este requisito que não estão concluídas
          items: { type: string }
        ultima_execucao: { $ref: '#/components/schemas/Execucao' }
        obsoleto: { $ref: '#/components/schemas/Obsoleto' }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    Obsoleto:
      type: object
      description: 'Presente só no requisito obsoleto: quando e por quê. Ele continua consultável, mas não limita os pais nem pesa entre os irmãos.'
      required: [em, motivo]
      properties:
        em: { type: string, format: date-time }
        motivo: { type: string }
    Obsolescencia:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string }
    Importancia:
      type: object
      required: [pai, fatia]
      properties:
        pai: { type: string, example: R-0001 }
        pontos: { type: integer, minimum: 1, description: 'Ausente: a ligação ainda não foi triada (conta como 1)' }
        fatia: { type: number, description: 'Pontos / soma dos pontos dos irmãos sob este pai, de 0 a 1' }
    Pontos:
      type: object
      properties:
        pontos: { type: integer, minimum: 1, description: 'Ausente: volta a não triado' }
    Prioridade:
      type: string
      description: 'Obsoleta, substituída pelos pontos de importância; guardada só como histórico.'
      enum: [alta, media, baixa]
    EstadoDoRequisito:
      type: string
      description: |
        Calculado, nunca escrito à mão. Do menos ao mais maduro: nao_atendido (tarefa aberta fora de
        andamento, ou nem tarefa nem execução), em_trabalho (tarefa em andamento), nao_validado
        (tarefas todas concluídas, sem execução),
        validacao_expirada (a última execução passou do prazo), validado. O estado próprio vem das
        tarefas ligadas e da última execução; o estado é o menos maduro entre o próprio e o de cada
        requisito abaixo. Sem tarefa e sem execução, um requisito com derivados é decidido só por eles.
      enum: [nao_atendido, em_trabalho, nao_validado, validacao_expirada, validado]
    Execucao:
      type: object
      required: [id, requisito, evidencia, realizada_em, autor, registrada_em]
      properties:
        id: { type: string, example: E-0001 }
        requisito: { type: string, example: R-0001 }
        evidencia: { type: string, description: 'O que foi verificado e como (comando, relatório, link)' }
        realizada_em: { type: string, format: date-time }
        valida_ate: { type: string, format: date-time, description: 'Sem prazo, não expira' }
        autor: { type: string }
        registrada_em: { type: string, format: date-time }
    NovaExecucao:
      type: object
      required: [evidencia]
      properties:
        evidencia: { type: string }
        realizada_em: { type: string, format: date-time, description: 'Padrão: agora' }
        validade_dias: { type: integer, minimum: 1, description: 'Dias a partir de realizada_em; sem ele, não expira' }
    Atencao:
      type: object
      required: [motivo, detalhe]
      properties:
        motivo: { $ref: '#/components/schemas/MotivoDeAtencao' }
        detalhe: { type: string }
    MotivoDeAtencao:
      type: string
      enum: [muitos_filhos, sem_origem, sem_descricao, sem_tarefa, trabalho_parado, outra_organizacao, obsoleto_com_tarefa_aberta]
    NovoRequisito:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string, description: 'Padrão: a do primeiro requisito em deriva_de' }
        origem: { type: string }
        deriva_de:
          type: array
          description: 'Padrão: o requisito zero (o único sem pais; o primeiro requisito criado é ele)'
          items: { type: string }
    AlteracaoRequisito:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        origem: { type: string, description: 'Vazio remove a origem' }
        prioridade: { type: string, description: 'Obsoleta (use os pontos da derivação): alta, media ou baixa; vazio limpa' }
    Derivacao:
      type: object
      required: [pai]
      properties:
        pai: { type: string, description: Requisito do qual este deriva }
        pontos: { type: integer, minimum: 1, description: 'Pontos de importância sob este pai; padrão: 1 se o requisito já tem outro pai, senão não triado' }
    VinculoRequisito:
      type: object
      required: [requisito]
      properties:
        requisito: { type: string }
    PedidoDeLancamento:
      type: object
      properties:
        instrucao: { type: string, description: 'Instrução adicional de reabertura, somada ao prompt padrão; o resto do contexto o agente lê da tarefa e das sessões anteriores' }
        modelo: { type: string, description: 'Um dos modelos do lançador; padrão: o primeiro' }
        esforco: { type: string, description: 'Um dos esforços do lançador; padrão: o configurado' }
        nome: { type: string, description: 'Nome curto da sessão do agente (tmux e remote-control), dizendo o assunto do trabalho; padrão: derivado do título' }
        forcar: { type: boolean, description: 'Sobe mesmo com menos RAM disponível que o mínimo; só depois de o Rafael confirmar' }
    Recursos:
      type: object
      required: [medido_em, memoria_total_mb, memoria_disponivel_mb, memoria_minima_mb, abaixo_do_minimo, nucleos, carga_1min, sessoes, agente_navegador, steam, docker, maiores_por_memoria, maiores_por_cpu, resumo]
      properties:
        medido_em: { type: string, format: date-time }
        memoria_total_mb: { type: integer }
        memoria_disponivel_mb: { type: integer, description: 'MemAvailable: o que ainda cabe, contando o cache que o kernel devolve' }
        memoria_minima_mb: { type: integer, description: 'Abaixo disto, lançar agente exige forcar' }
        abaixo_do_minimo: { type: boolean }
        nucleos: { type: integer }
        carga_1min: { type: number }
        sessoes:
          type: array
          description: 'Claude Code abertos, cada um com os servidores MCP filhos, da maior para a menor'
          items: { $ref: '#/components/schemas/SessaoNaMaquina' }
        agente_navegador:
          $ref: '#/components/schemas/GrupoDeProcessos'
        steam:
          $ref: '#/components/schemas/GrupoDeProcessos'
        docker:
          type: array
          description: Containers agrupados pelo projeto do compose, do maior para o menor
          items: { $ref: '#/components/schemas/ProjetoDocker' }
        erro_docker: { type: string, description: 'Por que os containers não foram medidos' }
        maiores_por_memoria:
          type: array
          items: { $ref: '#/components/schemas/ProcessoNaMaquina' }
        maiores_por_cpu:
          type: array
          items: { $ref: '#/components/schemas/ProcessoNaMaquina' }
        resumo: { type: string, description: 'Os números acima em poucas linhas, para dizer ao Rafael' }
    SessaoNaMaquina:
      type: object
      required: [nome, memoria_mb]
      properties:
        nome: { type: string, description: 'Nome curto (remote-control), ou o da sessão no rex' }
        sessao: { type: string, description: 'Sessão de trabalho ativa deste chat, se houver', example: S-0001 }
        tarefas:
          type: array
          items: { type: string }
        aguardando: { $ref: '#/components/schemas/EsperaDeSessao' }
        memoria_mb: { type: integer }
    GrupoDeProcessos:
      type: object
      required: [aberto, memoria_mb]
      properties:
        aberto: { type: boolean }
        memoria_mb: { type: integer }
    ProjetoDocker:
      type: object
      required: [projeto, containers, memoria_mb]
      properties:
        projeto: { type: string, description: 'com.docker.compose.project; vazio para container avulso' }
        memoria_mb: { type: integer }
        containers:
          type: array
          items:
            type: object
            required: [nome, memoria_mb]
            properties:
              nome: { type: string }
              memoria_mb: { type: integer }
    ProcessoNaMaquina:
      type: object
      required: [pid, nome, memoria_mb, cpu]
      properties:
        pid: { type: integer }
        nome: { type: string, description: 'Nome curto (comm), sem argumentos' }
        memoria_mb: { type: integer }
        cpu: { type: number, description: '% de um núcleo na amostra de 1 s' }
    OpcoesDeLancamento:
      type: object
      required: [modelos, esforcos, modelo_padrao]
      properties:
        modelos:
          type: array
          items: { type: string }
        esforcos:
          type: array
          items: { type: string }
        modelo_padrao: { type: string }
        esforco_padrao: { type: string }
    Sessao:
      type: object
      required: [id, status, agente, tipo_agente, servidor, artefatos, tarefas, iniciada_em]
      properties:
        id: { type: string, example: S-0001 }
        status: { $ref: '#/components/schemas/StatusSessao' }
        agente:
          type: string
          description: Provider, modelo e esforço, ou o nome de um humano. Imutável.
          example: Claude Opus 5.5 Medium
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        nome: { type: string, description: 'Nome curto do agente (tmux e remote-control), que diz o assunto do trabalho', example: dados-privado-joao }
        chat: { type: string, description: Identificador do chat do agente }
        servidor: { type: string, description: Máquina onde a sessão roda }
        anterior: { type: string, example: S-0001 }
        motivo_encerramento: { $ref: '#/components/schemas/MotivoEncerramento' }
        journal: { type: string, description: 'Localizador: <maquina>:<caminho> ou github.com/<dono>/<repo>@<commit>:<caminho>' }
        artefatos:
          type: array
          items: { type: string }
        tarefas:
          type: array
          items: { type: string }
        iniciada_em: { type: string, format: date-time }
        encerrada_em: { type: string, format: date-time }
        resumo: { type: string, description: Resumo gravado no encerramento desta sessão }
        aguardando: { $ref: '#/components/schemas/EsperaDeSessao' }
    NovaSessao:
      type: object
      required: [agente, tipo_agente, servidor, tarefas]
      properties:
        agente: { type: string }
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        chat: { type: string }
        servidor: { type: string }
        journal: { type: string }
        tarefas:
          type: array
          items: { type: string }
    SessaoCriada:
      type: object
      required: [sessao, token]
      properties:
        sessao: { $ref: '#/components/schemas/Sessao' }
        token: { type: string }
    AlteracaoSessao:
      type: object
      properties:
        journal: { type: string }
        nome: { type: string, description: 'Nome curto novo; o lançador renomeia o tmux e o remote-control do agente' }
        artefatos:
          type: array
          items: { type: string }
    Vinculo:
      type: object
      required: [tarefa]
      properties:
        tarefa: { type: string }
    Encerramento:
      type: object
      required: [resumo]
      properties:
        resumo: { type: string, description: Gravado como resumo de cada tarefa da sessão }
        journal: { type: string }
        artefatos:
          type: array
          items: { type: string }
    Repasse:
      type: object
      required: [agente, tipo_agente]
      properties:
        agente: { type: string }
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        chat: { type: string }
        servidor: { type: string, description: Se omitido, usa o da sessão anterior }
    ImportacaoTarefa:
      type: object
      required: [titulo, organizacao, status, criada_em, origem, sessoes]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        criada_em: { type: string, format: date-time }
        origem: { type: string, description: De onde a tarefa veio, para o log de eventos }
        sessoes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SessaoImportada' }
    SessaoImportada:
      type: object
      required: [agente, servidor, iniciada_em, encerrada_em, resumo]
      properties:
        agente: { type: string }
        servidor: { type: string }
        journal: { type: string }
        iniciada_em: { type: string, format: date-time }
        encerrada_em: { type: string, format: date-time }
        resumo: { type: string }
    Evento:
      type: object
      required: [id, momento, autor, entidade, tipo, dados]
      properties:
        id: { type: integer, format: int64 }
        momento: { type: string, format: date-time }
        autor: { type: string }
        entidade: { type: string }
        tipo: { type: string }
        dados:
          type: object
          additionalProperties: true
    StatusLembrete:
      type: string
      description: |
        agendado (esperando a hora), disparado (a hora chegou; pede atenção até confirmar ou adiar),
        adiado (reagendado depois de criado; volta a disparado na nova hora), confirmado e cancelado
        (finais).
      enum: [agendado, disparado, adiado, confirmado, cancelado]
    PrecisaoLembrete:
      type: string
      description: |
        Quão exata é a hora marcada. hora: o Rafael disse data e hora explícitas; o lembrete é
        sensível ao horário e as integrações podem tocar alarme. turno, dia, semana ou mes: vale para
        um turno (manhã, almoço, tarde ou noite), um dia, uma semana (de segunda a domingo) ou um mês
        inteiro; o rex põe `quando` no início da janela, então os da mesma janela disparam juntos e as
        integrações os avisam em lote, sem alarme.
      enum: [hora, turno, dia, semana, mes]
      x-enum-varnames: [PrecisaoHora, PrecisaoTurno, PrecisaoDia, PrecisaoSemana, PrecisaoMes]
    Lembrete:
      type: object
      required: [id, texto, quando, precisao, organizacao, status, autor, adiamentos, criado_em, atualizado_em]
      properties:
        id: { type: string, example: L-0001 }
        texto: { type: string }
        curto:
          type: string
          description: 'Palavra-chave para os resumos de pouco espaço (a ilha do iPhone), até 10 caracteres'
          example: ballet
        quando:
          type: string
          format: date-time
          description: 'Hora marcada atual (após adiamentos), com o fuso em que foi pedida'
          example: '2026-10-21T09:00:00-03:00'
        precisao: { $ref: '#/components/schemas/PrecisaoLembrete' }
        fim:
          type: string
          format: date-time
          description: 'Fim da janela (do turno ou do dia de `quando`); ausente na precisão hora'
        organizacao: { type: string }
        tarefa: { type: string, example: T-0001 }
        requisito: { type: string, example: R-0001 }
        status: { $ref: '#/components/schemas/StatusLembrete' }
        autor: { type: string, description: 'Sessão (S-0001) ou "local"' }
        disparado_em: { type: string, format: date-time, description: 'Último disparo' }
        atrasado:
          type: boolean
          description: 'O último disparo aconteceu depois da hora (o servidor estava parado)'
        adiamentos: { type: integer, description: 'Quantas vezes foi adiado' }
        confirmado_em: { type: string, format: date-time }
        link: { type: string, description: 'URL do lembrete no frontend, se o servidor conhece a base pública' }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    NovoLembrete:
      type: object
      required: [texto, quando, organizacao]
      properties:
        texto: { type: string }
        curto:
          type: string
          maxLength: 10
          description: 'Palavra-chave do lembrete, até 10 caracteres ("ballet", "dentista"); sem ela, as integrações usam o começo do texto'
        quando:
          type: string
          format: date-time
          description: |
            Instante com fuso; no passado é recusado. Em turno ou dia, qualquer hora do turno ou do
            dia: o rex a troca pelo início da janela, e só recusa se a janela inteira já passou.
        precisao:
          allOf: [{ $ref: '#/components/schemas/PrecisaoLembrete' }]
          description: 'Padrão: hora'
        organizacao: { type: string }
        tarefa: { type: string }
        requisito: { type: string }
    AlteracaoLembrete:
      type: object
      properties:
        texto: { type: string }
        curto: { type: string, maxLength: 10, description: 'Vazio remove a palavra-chave' }
        quando: { type: string, format: date-time }
        precisao:
          allOf: [{ $ref: '#/components/schemas/PrecisaoLembrete' }]
          description: 'Mudar a precisão (ou a hora de um turno ou dia) põe `quando` no início da janela'
        organizacao: { type: string }
        tarefa: { type: string, description: 'Vazio remove a ligação' }
        requisito: { type: string, description: 'Vazio remove a ligação' }
    Adiamento:
      type: object
      properties:
        ate: { type: string, format: date-time }
        minutos: { type: integer, minimum: 1 }
    Voz:
      type: object
      required: [sessao, tarefas, estado, novidades, omitidas]
      properties:
        sessao: { type: string, description: 'Sessão (S-0001)' }
        nome: { type: string, description: Nome curto da sessão }
        tarefas:
          type: array
          items: { type: string }
        estado: { $ref: '#/components/schemas/EstadoDaVoz' }
        tela:
          type: string
          description: 'Fim da tela do agente, só em pedindo_permissao: a pergunta e as opções numeradas'
        novidades:
          type: array
          description: 'O que aconteceu na conversa do agente depois do ponteiro, em ordem (as mais recentes, se muitas)'
          items: { $ref: '#/components/schemas/NovidadeDeVoz' }
        omitidas: { type: integer, description: Novidades mais antigas que ficaram de fora do limite }
    EstadoDaVoz:
      type: string
      description: |
        encerrada: a sessão terminou; sem_agente: a sessão está ativa mas o tmux do agente não foi
        achado; trabalhando, ocioso ou pedindo_permissao: lido da tela.
      enum: [encerrada, sem_agente, trabalhando, ocioso, pedindo_permissao]
      x-enum-varnames: [VozEncerrada, VozSemAgente, VozTrabalhando, VozOcioso, VozPedindoPermissao]
    PanoramaDeVoz:
      type: object
      required: [sessao, tarefas, estado, nao_ouvidas]
      properties:
        sessao: { type: string }
        nome: { type: string }
        tarefas:
          type: array
          items: { type: string }
        titulos:
          type: array
          description: Títulos das tarefas, na mesma ordem
          items: { type: string }
        estado: { $ref: '#/components/schemas/EstadoDaVoz' }
        palavras_chave:
          type: array
          description: Palavras do nome da sessão, para achar a de que o Rafael fala
          items: { type: string }
        aguardando: { type: string, description: 'O que o agente pediu ao Rafael (aguardar_resposta), se pediu' }
        nao_ouvidas: { type: integer, description: 'Textos do agente depois do ponteiro do que o Rafael ouviu e da última fala dele na sessão' }
        ultima: { type: string, description: 'Começo do último texto do agente, até uns 200 caracteres: o texto inteiro, a tela e as novidades vêm na situação da sessão' }
        ultima_em: { type: string, format: date-time }
    NovidadeDeVoz:
      type: object
      required: [de, texto, em]
      properties:
        de:
          type: string
          description: 'rafael (fala dele, inclusive pelo rex voz), sessao (mensagem de outra sessão, ver origem) ou agente'
          enum: [rafael, sessao, agente]
          x-enum-varnames: [DoRafael, DaSessao, DoAgente]
        origem: { type: string, description: 'Sessão (S-0001) que mandou a mensagem, quando de é sessao' }
        texto: { type: string }
        pedido: { type: integer, description: 'Pedido do rex voz a que se refere, quando há' }
        em: { type: string, format: date-time }
    MensagemDeVoz:
      type: object
      required: [texto]
      properties:
        texto: { type: string }
    PedidoDeVoz:
      type: object
      required: [pedido, sessao, estado]
      properties:
        pedido: { type: integer, description: Número do pedido na sessão }
        sessao: { type: string }
        estado: { $ref: '#/components/schemas/EstadoDaVoz' }
    MensagemEntreSessoes:
      type: object
      required: [de, para, estado]
      properties:
        de: { type: string, description: 'Sessão de origem (S-0001)' }
        para: { type: string, description: 'Sessão de destino' }
        estado: { $ref: '#/components/schemas/EstadoDaVoz' }
    TeclaDeVoz:
      type: object
      required: [tecla]
      properties:
        tecla:
          type: string
          enum: ['1', '2', '3', '4', Enter, Escape]
          x-enum-varnames: [Tecla1, Tecla2, Tecla3, Tecla4, TeclaEnter, TeclaEscape]
    Espera:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string, description: 'O que o agente precisa do Rafael, em uma linha' }
    EsperaDeSessao:
      type: object
      required: [mensagem, desde]
      properties:
        mensagem: { type: string }
        desde: { type: string, format: date-time }
    Pendencias:
      type: object
      required: [gerado_em, horizonte_ate, lembretes, tarefas_em_validacao, sessoes_aguardando, ultimo_evento]
      properties:
        gerado_em: { type: string, format: date-time }
        horizonte_ate: { type: string, format: date-time }
        lembretes:
          type: array
          description: 'Disparados primeiro, depois os que vencem até horizonte_ate, por hora marcada'
          items: { $ref: '#/components/schemas/Lembrete' }
        tarefas_em_validacao:
          type: array
          items: { $ref: '#/components/schemas/Tarefa' }
        sessoes_aguardando:
          type: array
          description: Sessões ativas cujo agente espera resposta do Rafael
          items: { $ref: '#/components/schemas/Sessao' }
        ultimo_evento:
          type: integer
          format: int64
          description: 'Id do último evento quando o retrato foi tirado; serve de cursor para GET /eventos?depois='
    Notificacao:
      type: object
      description: |
        Corpo de um gancho (webhook) ou stdin de um comando, configurados em -integracoes (ver
        docs/integracao.md). Traz o estado atual da entidade do evento, para o consumidor não chamar
        a API de volta; `atualizado_em` do lembrete ordena versões em upserts idempotentes.
      required: [evento]
      properties:
        evento: { $ref: '#/components/schemas/Evento' }
        lembrete: { $ref: '#/components/schemas/Lembrete' }
        tarefa: { $ref: '#/components/schemas/Tarefa' }
        sessao: { $ref: '#/components/schemas/Sessao' }
